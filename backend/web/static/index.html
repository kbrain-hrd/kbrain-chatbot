<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>셀프스터디 문의 대응</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #080d0c;
    --panel: #0e1614;
    --panel-2: #131e1b;
    --line: #1f2f2b;
    --line-bright: #2c433d;
    --ink: #dfe9e6;
    --ink-dim: #7d918c;
    --ink-faint: #4e605c;
    --mint: #4fe0b0;
    --amber: #e8b761;
    --coral: #f0705f;
    --azure: #5cb8ff;
    --mono: "IBM Plex Mono", ui-monospace, monospace;
    --sans: "IBM Plex Sans KR", system-ui, sans-serif;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--sans);
    font-weight: 300;
    line-height: 1.65;
    min-height: 100vh;
    background-image:
      radial-gradient(ellipse 80% 50% at 50% -10%, rgba(79, 224, 176, 0.06), transparent),
      repeating-linear-gradient(0deg, transparent 0 2px, rgba(255,255,255,0.008) 2px 4px);
  }

  header {
    border-bottom: 1px solid var(--line);
    padding: 18px 28px;
    display: flex;
    align-items: baseline;
    gap: 16px;
  }
  header h1 {
    font-size: 15px; font-weight: 600; margin: 0; letter-spacing: -0.01em;
  }
  header .sub {
    font-family: var(--mono); font-size: 11px; color: var(--ink-faint);
    letter-spacing: 0.06em; text-transform: uppercase;
  }
  header .live {
    margin-left: auto; font-family: var(--mono); font-size: 11px; color: var(--ink-faint);
    display: flex; align-items: center; gap: 7px;
  }
  header .live::before {
    content: ""; width: 6px; height: 6px; border-radius: 50%;
    background: var(--mint); box-shadow: 0 0 8px var(--mint);
    animation: pulse 2.4s ease-in-out infinite;
  }
  @keyframes pulse { 0%,100% { opacity: 1 } 50% { opacity: 0.35 } }

  main { max-width: 1240px; margin: 0 auto; padding: 26px 28px 80px; }

  .ask {
    display: grid; grid-template-columns: 1fr auto; gap: 12px;
    align-items: stretch; margin-bottom: 22px;
  }
  textarea {
    width: 100%; min-height: 88px; resize: vertical;
    background: var(--panel); color: var(--ink);
    border: 1px solid var(--line-bright); border-radius: 3px;
    padding: 14px 16px; font-family: var(--sans); font-size: 15px; font-weight: 300;
    line-height: 1.6; transition: border-color .15s;
  }
  textarea:focus { outline: none; border-color: var(--mint); }
  textarea::placeholder { color: var(--ink-faint); }

  button.go {
    background: var(--mint); color: #04140f; border: 0; border-radius: 3px;
    padding: 0 30px; font-family: var(--mono); font-size: 13px; font-weight: 500;
    letter-spacing: 0.08em; cursor: pointer; transition: filter .15s;
    text-transform: uppercase; white-space: nowrap;
  }
  button.go:hover:not(:disabled) { filter: brightness(1.12); }
  button.go:disabled { opacity: .4; cursor: default; }

  .hint {
    font-family: var(--mono); font-size: 11px; color: var(--ink-faint);
    margin: -14px 0 24px;
  }

  /* 판정 배지 줄 */
  .verdict {
    display: flex; flex-wrap: wrap; gap: 8px; align-items: center;
    margin-bottom: 18px;
  }
  .chip {
    font-family: var(--mono); font-size: 11px; letter-spacing: .05em;
    padding: 5px 11px; border-radius: 2px;
    border: 1px solid var(--line-bright); color: var(--ink-dim);
    background: var(--panel);
  }
  .chip.anchor { color: var(--mint); border-color: rgba(79,224,176,.35); }
  .chip.high   { color: var(--mint);  border-color: rgba(79,224,176,.4); }
  .chip.medium { color: var(--amber); border-color: rgba(232,183,97,.4); }
  .chip.low    { color: var(--ink-dim); }
  .chip.flag   { color: var(--coral); border-color: rgba(240,112,95,.45); }
  .chip .k { color: var(--ink-faint); margin-right: 6px; }

  /* 되묻기 — 주력 동작이라 화면을 지배한다 */
  .askback {
    border: 1px solid rgba(92,184,255,.35);
    background: linear-gradient(180deg, rgba(92,184,255,.09), rgba(92,184,255,.02));
    border-radius: 4px; padding: 34px 36px; margin-bottom: 18px;
  }
  .askback .label {
    font-family: var(--mono); font-size: 11px; letter-spacing: .12em;
    color: var(--azure); text-transform: uppercase; margin-bottom: 14px;
  }
  .askback .line {
    font-size: 27px; font-weight: 400; line-height: 1.45; letter-spacing: -0.02em;
  }
  .askback .why {
    margin-top: 16px; padding-top: 14px; border-top: 1px solid rgba(92,184,255,.18);
    font-size: 13px; color: var(--ink-dim);
  }
  .askback .why b { color: var(--ink); font-weight: 500; }

  /* 사람에게 넘김 */
  .escalate {
    border: 1px solid rgba(232,183,97,.32);
    background: linear-gradient(180deg, rgba(232,183,97,.08), transparent);
    border-radius: 4px; padding: 26px 30px; margin-bottom: 18px;
  }
  .escalate .label {
    font-family: var(--mono); font-size: 11px; letter-spacing: .12em;
    color: var(--amber); text-transform: uppercase; margin-bottom: 10px;
  }
  .escalate .line { font-size: 19px; font-weight: 400; }
  .escalate .why { margin-top: 10px; font-size: 13px; color: var(--ink-dim); }

  /* 초안 + 근거 */
  .split { display: grid; grid-template-columns: 1.55fr 1fr; gap: 16px; }
  @media (max-width: 940px) { .split { grid-template-columns: 1fr; } }

  .card {
    background: var(--panel); border: 1px solid var(--line);
    border-radius: 4px; padding: 24px 26px;
  }
  .card h2 {
    font-family: var(--mono); font-size: 11px; font-weight: 500;
    letter-spacing: .12em; text-transform: uppercase;
    color: var(--ink-faint); margin: 0 0 16px;
    padding-bottom: 10px; border-bottom: 1px solid var(--line);
  }
  .draft { font-size: 15.5px; line-height: 1.78; white-space: pre-wrap; }
  .draft strong { font-weight: 600; color: #fff; }

  .evidence { list-style: none; margin: 0; padding: 0; }
  .evidence li {
    font-size: 12.5px; line-height: 1.6; color: var(--ink-dim);
    padding: 11px 0 11px 15px; border-left: 2px solid var(--line-bright);
    margin-bottom: 9px; background: rgba(255,255,255,.012);
  }
  .evidence li:last-child { margin-bottom: 0; }

  .warn {
    border: 1px solid rgba(240,112,95,.4);
    background: rgba(240,112,95,.07);
    border-radius: 3px; padding: 14px 18px; margin-bottom: 16px;
    font-size: 13.5px; color: #ffd5cd;
  }
  .warn b { color: var(--coral); }

  /* 상태 */
  .status {
    font-family: var(--mono); font-size: 12px; color: var(--ink-faint);
    padding: 30px 0; display: flex; align-items: center; gap: 10px;
  }
  .status::before {
    content: ""; width: 8px; height: 8px; border-radius: 50%;
    background: var(--mint); animation: blink .9s steps(2) infinite;
  }
  @keyframes blink { 0%,49% { opacity: 1 } 50%,100% { opacity: .15 } }

  .error {
    border: 1px solid rgba(240,112,95,.45); background: rgba(240,112,95,.08);
    border-radius: 3px; padding: 16px 20px; color: #ffd5cd; font-size: 14px;
  }

  .fade { animation: rise .32s cubic-bezier(.2,.7,.3,1) both; }
  @keyframes rise { from { opacity: 0; transform: translateY(7px) } to { opacity: 1; transform: none } }
</style>
</head>
<body>
<header>
  <h1>셀프스터디 문의 대응</h1>
  <span class="sub">유선 응대 콘솔</span>
  <span class="live">근거 기반 · 사람 검수</span>
</header>

<main>
  <div class="ask">
    <textarea id="q" placeholder="응시자 문의를 그대로 옮겨 적으세요.&#10;예) 3세트 2과목 제출파일은 몇 개 내나요?"></textarea>
    <button class="go" id="go">판정</button>
  </div>
  <div class="hint">Ctrl + Enter 로도 실행됩니다. 되묻기는 즉시, 초안은 몇 초 걸립니다.</div>

  <div id="out"></div>
</main>

<script>
const $q = document.getElementById('q');
const $go = document.getElementById('go');
const $out = document.getElementById('out');

const ACTION_LABEL = {
  answer: '답변 가능', ask_grade: '등급 되묻기',
  escalate: '담당자 확인 필요', ignore: '대응 불필요',
};

function esc(s) {
  return String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
}
function set(html) { $out.innerHTML = html; }
function busy(msg) { set(`<div class="status">${esc(msg)}</div>`); }

function chips(j, extra = '') {
  const parts = [`<span class="chip"><span class="k">분류</span>${esc(j.category)}</span>`];
  if (j.anchor) parts.push(`<span class="chip anchor">${esc(j.anchor)}</span>`);
  parts.push(`<span class="chip"><span class="k">행동</span>${esc(ACTION_LABEL[j.action] || j.action)}</span>`);
  if (j.cached) parts.push(`<span class="chip"><span class="k">카탈로그</span>캐시</span>`);
  return `<div class="verdict fade">${parts.join('')}${extra}</div>`;
}

function renderAskBack(j) {
  return chips(j) + `
    <div class="askback fade">
      <div class="label">이렇게 되물어 주세요</div>
      <div class="line">"그린 과정이신가요, 블루 과정이신가요?"</div>
      <div class="why">
        <b>그린과 블루는 세트명과 주제가 같고 정답만 다릅니다.</b>
        등급을 확인하지 않고 답하면 다른 등급의 정답을 근거로 안내하게 됩니다.
        ${j.anchor ? `현재 <code>${esc(j.anchor)}</code> 까지 좁혀진 상태입니다.` : ''}
      </div>
    </div>`;
}

function renderEscalate(j) {
  return chips(j) + `
    <div class="escalate fade">
      <div class="label">담당자 확인이 필요합니다</div>
      <div class="line">이 문의는 자료만으로 답할 수 없습니다.</div>
      <div class="why">${esc(j.reason)}</div>
    </div>`;
}

function renderDraft(j, d) {
  const flagChips = (d.flags || [])
    .map(f => `<span class="chip flag">${esc(f)}</span>`).join('');
  const conf = `<span class="chip ${esc(d.confidence)}"><span class="k">신뢰도</span>${esc(d.confidence)}</span>`;

  const warn = d.disputed ? `
    <div class="warn fade">
      <b>공식 정답 오류가 확인된 문항입니다.</b>
      출제기관이 오류를 인정하고 수정 예정입니다. 정답을 단정해 안내하지 마시고
      경위만 전달한 뒤 검수자에게 넘겨 주세요.
    </div>` : '';

  const evidence = (d.evidence || []).length
    ? `<ul class="evidence">${d.evidence.map(e => `<li>${esc(e)}</li>`).join('')}</ul>`
    : `<div style="color:var(--ink-faint);font-size:13px">근거 인용이 없습니다.</div>`;

  return chips(j, conf + flagChips) + warn + `
    <div class="split fade">
      <div class="card">
        <h2>답변 초안 — 검수 후 전달</h2>
        <div class="draft">${esc(d.answer)}</div>
      </div>
      <div class="card">
        <h2>근거</h2>
        ${evidence}
      </div>
    </div>`;
}

async function post(url, body) {
  const res = await fetch(url, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(body),
  });
  if (!res.ok) {
    const detail = await res.json().catch(() => ({}));
    throw new Error(detail.detail || `요청 실패 (${res.status})`);
  }
  return res.json();
}

async function run() {
  const question = $q.value.trim();
  if (!question) { $q.focus(); return; }

  $go.disabled = true;
  busy('문항을 특정하는 중…');

  try {
    const j = await post('/api/classify', { question });

    if (j.action === 'ask_grade') { set(renderAskBack(j)); return; }
    if (j.action !== 'answer' || !j.anchor) { set(renderEscalate(j)); return; }

    set(chips(j) + `<div class="status">근거 자료를 읽고 초안을 쓰는 중…</div>`);
    const d = await post('/api/draft', { question, anchor: j.anchor });
    set(renderDraft(j, d));
  } catch (err) {
    set(`<div class="error fade">${esc(err.message)}</div>`);
  } finally {
    $go.disabled = false;
  }
}

$go.addEventListener('click', run);
$q.addEventListener('keydown', e => {
  if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) run();
});
$q.focus();
</script>
</body>
</html>
