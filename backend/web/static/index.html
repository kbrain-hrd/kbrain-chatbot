<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>셀프스터디 문의 대응</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@400;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
  :root {
    --paper:      #f6f2e9;
    --paper-2:    #fffdf8;
    --paper-sink: #ece6d8;
    --rule:       #d9d0bd;
    --rule-hard:  #2b2723;
    --ink:        #1c1a17;
    --ink-2:      #4a453d;
    --ink-3:      #857d70;
    --vermilion:  #b5342a;
    --vermilion-w:#f6e4e0;
    --seal:       #a82c22;
    --moss:       #3f6b4a;
    --ochre:      #a97822;

    --serif:  "Nanum Myeongjo", serif;
    --sans:   Pretendard, system-ui, sans-serif;
    --mono:   "IBM Plex Mono", monospace;
  }

  * { box-sizing: border-box; }

  html { background: var(--paper); }
  body {
    margin: 0;
    font-family: var(--sans);
    color: var(--ink);
    line-height: 1.7;
    -webkit-font-smoothing: antialiased;
    background-image:
      radial-gradient(circle at 12% 8%,  rgba(181,52,42,.035), transparent 32%),
      radial-gradient(circle at 88% 4%,  rgba(63,107,74,.03),  transparent 28%);
    background-attachment: fixed;
  }

  /* ── 제호 ───────────────────────────────── */
  .masthead {
    border-bottom: 3px double var(--rule-hard);
    padding: 22px 40px 14px;
    display: flex; align-items: flex-end; gap: 18px;
    background: var(--paper-2);
  }
  .masthead h1 {
    font-family: var(--serif); font-weight: 800;
    font-size: 26px; margin: 0; letter-spacing: -.03em;
  }
  .masthead .tag {
    font-family: var(--serif); font-size: 13px; color: var(--ink-3);
    padding-bottom: 4px; letter-spacing: .02em;
  }
  .masthead .rule {
    margin-left: auto; font-family: var(--mono); font-size: 10.5px;
    color: var(--ink-3); letter-spacing: .1em; text-transform: uppercase;
    padding-bottom: 5px; border-bottom: 2px solid var(--vermilion);
  }

  main { max-width: 1180px; margin: 0 auto; padding: 34px 40px 90px; }

  /* ── 입력 ───────────────────────────────── */
  .ask { margin-bottom: 12px; }
  .ask label {
    display: block; font-family: var(--serif); font-size: 13px;
    color: var(--ink-3); margin-bottom: 8px; letter-spacing: .04em;
  }
  .ask .row { display: flex; gap: 0; align-items: stretch; }
  textarea {
    flex: 1; min-height: 92px; resize: vertical;
    background: var(--paper-2); color: var(--ink);
    border: 1.5px solid var(--rule-hard); border-right: 0;
    padding: 16px 18px; font-family: var(--sans); font-size: 16px;
    line-height: 1.65;
  }
  textarea:focus { outline: none; background: #fff; }
  textarea::placeholder { color: #b3aa9a; }

  button.go {
    background: var(--rule-hard); color: var(--paper);
    border: 1.5px solid var(--rule-hard); cursor: pointer;
    padding: 0 34px; font-family: var(--serif); font-weight: 700;
    font-size: 16px; letter-spacing: .1em; transition: background .14s;
    white-space: nowrap;
  }
  button.go:hover:not(:disabled) { background: var(--vermilion); border-color: var(--vermilion); }
  button.go:disabled { opacity: .35; cursor: default; }

  .hint {
    font-family: var(--mono); font-size: 11px; color: var(--ink-3);
    margin-bottom: 34px;
  }

  /* ── 판정 머리글 ────────────────────────── */
  .verdict {
    display: flex; flex-wrap: wrap; gap: 0; align-items: stretch;
    border-top: 1.5px solid var(--rule-hard);
    border-bottom: 1px solid var(--rule);
    margin-bottom: 26px;
  }
  .cell {
    padding: 9px 16px 9px 0; margin-right: 16px;
    border-right: 1px solid var(--rule);
    display: flex; align-items: baseline; gap: 9px;
  }
  .cell:last-child { border-right: 0; }
  .cell .k {
    font-family: var(--serif); font-size: 11.5px; color: var(--ink-3);
    letter-spacing: .06em;
  }
  .cell .v { font-size: 14px; font-weight: 600; }
  .cell .v.anchor { font-family: var(--mono); font-size: 13px; letter-spacing: -.02em; }
  .v.high   { color: var(--moss); }
  .v.medium { color: var(--ochre); }
  .v.low    { color: var(--ink-3); }
  .cell.flagged .v { color: var(--vermilion); }

  /* ── 되묻기: 지면을 지배한다 ─────────────── */
  .askback {
    background: var(--paper-2);
    border: 1.5px solid var(--rule-hard);
    border-left: 7px solid var(--vermilion);
    padding: 40px 46px 34px; margin-bottom: 22px;
    position: relative;
  }
  .askback::after {
    content: "確認"; position: absolute; top: 26px; right: 34px;
    font-family: var(--serif); font-size: 15px; font-weight: 700;
    color: var(--seal); border: 2px solid var(--seal); border-radius: 3px;
    padding: 7px 9px; line-height: 1; opacity: .82;
    transform: rotate(6deg);
  }
  .askback .label {
    font-family: var(--serif); font-size: 13px; color: var(--vermilion);
    letter-spacing: .1em; margin-bottom: 16px;
  }
  .askback .line {
    font-family: var(--serif); font-weight: 700;
    font-size: 34px; line-height: 1.42; letter-spacing: -.035em;
    margin-bottom: 22px; max-width: 22ch;
  }
  .askback .why {
    border-top: 1px solid var(--rule); padding-top: 16px;
    font-size: 14px; color: var(--ink-2); max-width: 62ch;
  }
  .askback .why b { color: var(--ink); font-weight: 700; }
  .askback .why code {
    font-family: var(--mono); font-size: 12.5px;
    background: var(--paper-sink); padding: 2px 6px;
  }

  /* ── 담당자 확인 ───────────────────────── */
  .escalate {
    background: var(--paper-2); border: 1.5px solid var(--rule);
    border-left: 7px solid var(--ochre);
    padding: 30px 36px; margin-bottom: 22px;
  }
  .escalate .label {
    font-family: var(--serif); font-size: 13px; color: var(--ochre);
    letter-spacing: .1em; margin-bottom: 12px;
  }
  .escalate .line {
    font-family: var(--serif); font-weight: 700; font-size: 23px;
    letter-spacing: -.02em; margin-bottom: 12px;
  }
  .escalate .why { font-size: 14px; color: var(--ink-2); max-width: 62ch; }

  /* ── 초안 + 근거 ───────────────────────── */
  .split { display: grid; grid-template-columns: 1.6fr 1fr; gap: 0; }
  @media (max-width: 960px) { .split { grid-template-columns: 1fr; } }

  .col { background: var(--paper-2); border: 1.5px solid var(--rule-hard); }
  .col + .col { border-left: 0; }
  @media (max-width: 960px) { .col + .col { border-left: 1.5px solid var(--rule-hard); border-top: 0; } }

  .col > h2 {
    font-family: var(--serif); font-size: 13px; font-weight: 700;
    letter-spacing: .1em; color: var(--ink-2); margin: 0;
    padding: 13px 30px; border-bottom: 1px solid var(--rule);
    background: var(--paper-sink);
  }
  .col > .body { padding: 30px 34px 34px; }

  .draft {
    font-size: 16.5px; line-height: 1.85; white-space: pre-wrap;
    max-width: 64ch;
  }
  .draft strong { font-weight: 700; }

  .evidence { list-style: none; margin: 0; padding: 0; counter-reset: e; }
  .evidence li {
    counter-increment: e; position: relative;
    font-size: 13px; line-height: 1.7; color: var(--ink-2);
    padding: 0 0 16px 30px; margin-bottom: 14px;
    border-bottom: 1px dotted var(--rule);
  }
  .evidence li:last-child { border-bottom: 0; margin-bottom: 0; padding-bottom: 0; }
  .evidence li::before {
    content: counter(e); position: absolute; left: 0; top: 1px;
    font-family: var(--serif); font-weight: 700; font-size: 12px;
    color: var(--paper-2); background: var(--rule-hard);
    width: 19px; height: 19px; line-height: 19px; text-align: center;
  }

  /* ── 경고 ───────────────────────────────── */
  .warn {
    background: var(--vermilion-w); border: 1.5px solid var(--vermilion);
    padding: 18px 24px; margin-bottom: 22px; font-size: 14.5px;
    color: #5e1b15; max-width: 78ch;
  }
  .warn b { color: var(--vermilion); font-weight: 700; }

  /* ── 상태 ───────────────────────────────── */
  .status {
    font-family: var(--serif); font-size: 15px; color: var(--ink-3);
    padding: 40px 0 44px; letter-spacing: .04em;
  }
  .status::after {
    content: "···"; margin-left: 3px; letter-spacing: .2em;
    animation: dots 1.3s steps(4) infinite;
  }
  @keyframes dots { 0%{opacity:.25} 50%{opacity:1} 100%{opacity:.25} }

  .error {
    background: var(--vermilion-w); border: 1.5px solid var(--vermilion);
    padding: 18px 24px; color: #5e1b15; font-size: 15px;
  }

  .fade { animation: rise .34s cubic-bezier(.2,.75,.3,1) both; }
  @keyframes rise { from { opacity:0; transform: translateY(9px) } to { opacity:1; transform:none } }
</style>
</head>
<body>

<div class="masthead">
  <h1>셀프스터디 문의 대응</h1>
  <span class="tag">유선 응대용</span>
  <span class="rule">근거 기반 · 사람 검수</span>
</div>

<main>
  <div class="ask">
    <label>응시자 문의</label>
    <div class="row">
      <textarea id="q" placeholder="들으신 내용을 그대로 옮겨 적으세요.&#10;예) 3세트 2과목 제출파일은 몇 개 내나요?"></textarea>
      <button class="go" id="go">조회</button>
    </div>
  </div>
  <div class="hint">Ctrl + Enter — 되묻기는 즉시, 초안은 십여 초</div>

  <div id="out"></div>
</main>

<script>
const $q = document.getElementById('q');
const $go = document.getElementById('go');
const $out = document.getElementById('out');

const ACTION_LABEL = {
  answer: '답변 가능', ask_grade: '등급 되묻기',
  escalate: '담당자 확인', ignore: '대응 불필요',
};

const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const set = html => { $out.innerHTML = html; };
const busy = msg => set(`<div class="status">${esc(msg)}</div>`);

function cell(k, v, cls = '', flagged = false) {
  return `<div class="cell${flagged ? ' flagged' : ''}">
    <span class="k">${esc(k)}</span><span class="v ${cls}">${esc(v)}</span></div>`;
}

function verdict(j, extra = '') {
  let html = cell('분류', j.category);
  if (j.anchor) html += cell('근거', j.anchor, 'anchor');
  html += cell('판정', ACTION_LABEL[j.action] || j.action);
  return `<div class="verdict fade">${html}${extra}</div>`;
}

function renderAskBack(j) {
  return verdict(j) + `
    <div class="askback fade">
      <div class="label">이렇게 되물어 주세요</div>
      <div class="line">그린 과정이신가요,<br>블루 과정이신가요?</div>
      <div class="why">
        <b>그린과 블루는 세트명과 주제가 같고 정답만 다릅니다.</b>
        등급을 확인하지 않고 답하면 다른 등급의 정답을 근거로 안내하게 됩니다.
        ${j.anchor ? `지금은 <code>${esc(j.anchor)}</code> 까지 좁혀진 상태입니다.` : ''}
      </div>
    </div>`;
}

function renderEscalate(j) {
  return verdict(j) + `
    <div class="escalate fade">
      <div class="label">담당자 확인이 필요합니다</div>
      <div class="line">보유 자료만으로는 답할 수 없습니다.</div>
      <div class="why">${esc(j.reason)}</div>
    </div>`;
}

function renderDraft(j, d) {
  const extra =
    cell('신뢰도', d.confidence, esc(d.confidence)) +
    ((d.flags || []).length ? cell('유의', d.flags.join(' · '), '', true) : '');

  const warn = d.disputed ? `
    <div class="warn fade">
      <b>공식 정답에 오류가 확인된 문항입니다.</b>
      출제기관이 오류를 인정하고 수정 예정입니다. 정답을 단정해 안내하지 마시고,
      경위만 전달한 뒤 검수자에게 넘겨 주세요.
    </div>` : '';

  const evidence = (d.evidence || []).length
    ? `<ul class="evidence">${d.evidence.map(e => `<li>${esc(e)}</li>`).join('')}</ul>`
    : `<div style="color:var(--ink-3);font-size:13px">근거 인용이 없습니다.</div>`;

  return verdict(j, extra) + warn + `
    <div class="split fade">
      <div class="col">
        <h2>답변 초안 — 검수 후 전달</h2>
        <div class="body"><div class="draft">${esc(d.answer)}</div></div>
      </div>
      <div class="col">
        <h2>근거</h2>
        <div class="body">${evidence}</div>
      </div>
    </div>`;
}

async function post(url, body) {
  const res = await fetch(url, {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(body),
  });
  if (!res.ok) {
    const detail = await res.json().catch(() => ({}));
    throw new Error(detail.detail || `요청 실패 (${res.status})`);
  }
  return res.json();
}

async function run() {
  const question = $q.value.trim();
  if (!question) { $q.focus(); return; }

  $go.disabled = true;
  busy('문항을 특정하는 중');

  try {
    const j = await post('/api/classify', { question });
    if (j.action === 'ask_grade') { set(renderAskBack(j)); return; }
    if (j.action !== 'answer' || !j.anchor) { set(renderEscalate(j)); return; }

    set(verdict(j) + `<div class="status">근거를 읽고 초안을 쓰는 중</div>`);
    const d = await post('/api/draft', { question, anchor: j.anchor });
    set(renderDraft(j, d));
  } catch (err) {
    set(`<div class="error fade">${esc(err.message)}</div>`);
  } finally {
    $go.disabled = false;
  }
}

$go.addEventListener('click', run);
$q.addEventListener('keydown', e => {
  if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) run();
});
$q.focus();
</script>
</body>
</html>
